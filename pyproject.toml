[project]
name = "hoopla"
version = "0.1.0"
description = "A movie search engine using BM25 ranking and semantic search algorithms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.48.0",
    "nltk==3.9.1",
    "numpy>=2.3.4",
    "pillow>=12.0.0",
    "python-dotenv>=1.2.1",
    "sentence-transformers>=5.1.2",
    "torch==2.14.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

# CPU-only torch keeps installs small (no CUDA wheels); the app runs on CPU.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
