name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full known-item eval (all four search modes, builds embeddings)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint new code
        run: uv run ruff check tests eval/known_item
      - name: Unit tests
        run: uv run pytest -q
      - name: Fetch corpus and fixtures
        run: |
          mkdir -p data
          cp eval/fixtures/stopwords.txt eval/fixtures/golden_dataset.json data/
          curl -fsSL -o data/movies.json https://storage.googleapis.com/qvault-webapp-dynamic-assets/course_assets/movies.json
      - name: Known-item regression gate (BM25)
        run: uv run python eval/known_item/run_known_item.py --configs bm25 --check
      - name: Full known-item eval (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: uv run python eval/known_item/run_known_item.py --check --output eval/known_item/results.json
